{% extends 'dash_base.html' %} {% block title %} {{title}} {% endblock %} 



{% block nav_head %} Dashboard sign-up {% endblock %}
{% block nav %} {% endblock %}
{% block content %}
<h1>sign-up</h1>
<div class="shadow p-3 mb-5 bg-body rounded" id="signupForm">
<form method="POST" align="center">
    <h3 align="center">Sign Up</h3>

    <div class="form-group">
        <label for="username">User Name</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" />
    </div> <br>
    <div class="form-group">
        <label for="password1">Password</label>
        <input type="password" class="form-control" id="password1" name="password1" placeholder="Enter password" />
    </div><br>
    <div class="form-group">
        <label for="password2">Password (Confirm)</label>
        <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm password" />
    </div>

    <br>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>

{% endblock %}
